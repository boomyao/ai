    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="bg"><canvas id="bgc" width="1920" height="1080"></canvas></div>
      <div id="scenes"></div>
      <div id="overlay"></div>
      <canvas id="grain" width="1920" height="1080"></canvas>
    </div>
    <script>
      window.addEventListener('error', e => console.error('[err]', e.message, e.filename + ':' + e.lineno));
      window.addEventListener('unhandledrejection', e => console.error('[rej]', e.reason && (e.reason.stack || e.reason)));
    </script>
    <script src="../build/data.js"></script>
    <script src="engine.js"></script>
    <script src="components.js"></script>
    <script src="art.js"></script>
    <script src="background.js"></script>
    <script src="subtitles.js"></script>
    <script src="scenes/00-cold-parts.js"></script>
    <script src="scenes/00-cold.js"></script>
    <script src="scenes/01-errors.js"></script>
    <script src="scenes/02-burden.js"></script>
    <script src="scenes/03-confession.js"></script>
    <script src="scenes/04-huugjilt.js"></script>
    <script src="scenes/05-wall.js"></script>
    <script>
      (async () => {
        const only = new URLSearchParams(location.search).get('only');
        if (only) E.timeline = E.timeline.filter(sc => only.split(',').includes(sc.id));
        E.finalize();
        E.buildSubs();
        await E.preloadFonts();
        window.__total = E.total;
        window.__cues = E.cues;
        window.__subs = E.subsAll;
        window.__chapters = E.chapters.map(c => ({ start: c.start, num: c.num, title: c.title }));
        window.__scenes = E.timeline.map(sc => ({ id: sc.id, start: sc.start, dur: sc.dur }));
        const q = new URLSearchParams(location.search);
        E.seek(Number(q.get('t') || 0));
        window.__ready = true;
      })();
    </script>
  </body>
</html>
