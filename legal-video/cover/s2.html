<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>封面 2元赔1000</title>
    <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/chinese-simplified-900.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/chinese-simplified-700.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-sc/chinese-simplified-900.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/oswald/latin-500.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/oswald/latin-700.css" />
    <link rel="stylesheet" href="cover.css" />
  </head>
  <body>
    <div id="c">
      <svg width="1920" height="1200" viewBox="0 0 1920 1200" id="s">
        <defs>
          <radialGradient id="bg" cx="0.62" cy="0.55" r="0.85">
            <stop offset="0" stop-color="#ffe46b" />
            <stop offset="0.5" stop-color="#ffb52e" />
            <stop offset="1" stop-color="#e2611a" />
          </radialGradient>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5a1d00" flood-opacity="0.45" />
          </filter>
          <filter id="tshadow" x="-10%" y="-10%" width="120%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#5a1d00" flood-opacity="0.5" />
          </filter>
        </defs>
        <rect width="1920" height="1200" fill="url(#bg)" />
        <g id="rays" opacity="0.16"></g>
        <!-- bottle with price tag -->
        <g transform="translate(1040 300) rotate(-6) scale(0.78)" filter="url(#shadow)"><g id="bot"></g></g>
        <g transform="translate(860 860) rotate(-8)" filter="url(#shadow)">
          <rect x="0" y="0" width="230" height="110" rx="10" fill="#ffffff" />
          <rect x="0" y="0" width="230" height="30" rx="10" fill="#e8402f" />
          <text x="16" y="23" font-family="Noto Sans SC" font-weight="700" font-size="20" fill="#fff" letter-spacing="2">饮用水 550mL</text>
          <text x="16" y="98" font-family="Oswald" font-weight="700" font-size="64" fill="#1b1b1b">¥2.00</text>
        </g>
        <!-- arrow to the money -->
        <path d="M 1250 600 C 1340 520 1420 520 1480 560" fill="none" stroke="#7a2400" stroke-width="14" stroke-linecap="round" />
        <path d="M 1462 520 L 1500 572 L 1440 590 Z" fill="#7a2400" />
        <image href="assets/yen_banknote.png" x="1500" y="640" width="250" height="250" transform="rotate(-14 1625 765)" filter="url(#shadow)" />
        <image href="assets/yen_banknote.png" x="1600" y="520" width="230" height="230" transform="rotate(18 1715 635)" filter="url(#shadow)" />
        <image href="assets/money_bag.png" x="1440" y="300" width="330" height="330" filter="url(#shadow)" />
        <image href="assets/face_screaming_in_fear.png" x="1650" y="40" width="230" height="230" transform="rotate(12 1765 155)" />
        <!-- headline -->
        <g filter="url(#tshadow)">
          <text x="96" y="300" font-family="Noto Sans SC" font-weight="900" font-size="170" fill="#ffffff" stroke="#5a1d00" stroke-width="18" paint-order="stroke" stroke-linejoin="round">2块钱的水</text>
          <text x="80" y="590" font-family="Noto Sans SC" font-weight="900" font-size="230" fill="#e8251a" stroke="#ffffff" stroke-width="22" paint-order="stroke" stroke-linejoin="round">赔你</text>
          <text x="560" y="590" font-family="Oswald" font-weight="700" font-size="270" fill="#e8251a" stroke="#ffffff" stroke-width="22" paint-order="stroke" stroke-linejoin="round">1000</text>
        </g>
        <g transform="translate(96 660)">
          <rect x="0" y="0" width="640" height="108" rx="54" fill="#5a1d00" opacity="0.9" />
          <text x="46" y="74" font-family="Noto Sans SC" font-weight="700" font-size="58" fill="#ffffff" letter-spacing="2">凭什么？</text>
        </g>
      </svg>
      <canvas class="grain" width="1920" height="1200"></canvas>
    </div>
    <script src="bottle.js"></script>
    <script>
      const NS = 'http://www.w3.org/2000/svg';
      document.getElementById('bot').innerHTML = bottle('h');
      let sd = 5;
      const r = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
      const rays = document.getElementById('rays');
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        const a2 = a + 0.08;
        const p = document.createElementNS(NS, 'polygon');
        p.setAttribute('points', `1200,640 ${1200 + Math.cos(a) * 2200},${640 + Math.sin(a) * 2200} ${1200 + Math.cos(a2) * 2200},${640 + Math.sin(a2) * 2200}`);
        p.setAttribute('fill', '#ffffff');
        rays.append(p);
      }
      const cv = document.querySelector('.grain');
      const ctx = cv.getContext('2d');
      const img = ctx.createImageData(1920, 1200);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 128 + (r() - 0.5) * 36;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      Promise.all(['money_bag', 'yen_banknote', 'face_screaming_in_fear'].map(n => new Promise(res => { const im = new Image(); im.onload = res; im.src = `assets/${n}.png`; }))).then(() => document.fonts.ready).then(() => (window.__ready = true));
    </script>
  </body>
</html>
